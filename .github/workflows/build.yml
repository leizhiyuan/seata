name: "build"

on:
  push:
    branches: [ 2.x, develop, master, bystander_2.x ]
  pull_request:
    branches: [ 2.x, develop, master, bystander_2.x ]

jobs:
  # job 1: Test based on java 8 and 17. Do not checkstyle.
  build:
    name: "build"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 8, 17 ]
    steps:
      # step 1
      - name: "Checkout"
        uses: actions/checkout@v3
      # step 2
      - name: "Set up Java JDK"
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
      # step 3
      - name: "Print maven version"
        run: ./mvnw -version
      # step 4
      - name: "Build with Maven"
        run: |
          echo "mock maven"
      # step 5
      - name: "Codecov"
        if: matrix.java == '8'
        uses: codecov/codecov-action@v3.1.4

  # job 2: Test on 'arm64v8/ubuntu' OS.
  build_arm64-binary:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'snapshot' || github.ref_name == '2.x'  || github.ref_name == 'bystander_2.x') }}
    strategy:
      fail-fast: false
    steps:
      # step 1
      - name: "Checkout"
        uses: actions/checkout@v3
      # step 2
      - name: "Set up QEMU"
        id: qemu
        uses: docker/setup-qemu-action@v3
      # step 3
      - name: "Build arm-binary"
        run: |
          echo "mock build"
